name: Web CI
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # DEPLOY-01: nginx şablonu gerçek nginx:1.27-alpine içinde (IP maskeli log, PORT/BACKEND_URL env, güvenlik başlıkları).
      - run: node --test scripts/deploy/nginx.test.mjs
