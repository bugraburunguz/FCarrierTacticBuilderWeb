# PROD-PREP 6a: istemci IP'si. Railway edge istemci adresini X-Real-IP ile verir (docs.railway.com/networking/public-networking/specs-and-limits);
# edge yoksa (yerel compose) bağlantı adresi kullanılır. Backend bu başlığı yalnız FCAREER_TRUST_PROXY=true iken okur;
# X-Forwarded-For iletilmez (istemci ekleyebildiği için güvenilmez).
map $http_x_real_ip $fc_client_ip {
  ""      $remote_addr;
  default $http_x_real_ip;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 200m;
  server_tokens off;

  # Uzun süren yönetim işlemleri (ingestion, ML valuation) için geniş zaman aşımı.
  location /api/v1/admin/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $fc_client_ip;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 1800s;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $fc_client_ip;
    proxy_set_header X-Forwarded-For "";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
