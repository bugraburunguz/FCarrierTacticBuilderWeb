# PROD-PREP 6d: güvenlik başlıkları. Her location'a include edilir (location içindeki add_header, server düzeyindekileri ezer).
# Fontlar @fontsource ile kendi sunucumuzdan gelir: Google Fonts izni gerekmez. style-src 'unsafe-inline': Radix/odak kilidi çalışma anında <style> ekler.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
